<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magloggen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Magloggen</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1b2a2f;--mute:#627076;--line:#dbe2de;--meal:#1f5f6b;--warn:#8b2f5c;--on:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a1c;--card:#172325;--ink:#e7efee;--mute:#8fa3a6;--line:#263538;--meal:#6fc0cd;--warn:#e48ab5;--on:#0f1a1c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:14px 18px 4px}
h1{font:700 28px/1.1 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
#st{margin:4px 0 0;color:var(--mute);font-size:14px}#st.warn{color:var(--warn);font-weight:600}
main{flex:1;overflow:auto;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
h2{font:700 18px/1.2 ui-rounded,-apple-system,system-ui,sans-serif;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card.form{border-top:5px solid var(--meal)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:0 0 10px}
input[type=text],input[type=password],textarea{-webkit-appearance:none;appearance:none}
input[type=datetime-local]{min-height:46px}
textarea{line-height:1.45;resize:vertical}
.lbl{display:block;font-size:14px;color:var(--mute);margin:2px 0 4px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px}
button.pri{background:var(--meal);border-color:var(--meal);color:var(--on);font-weight:600}
.row{display:flex;gap:8px}.row>*{flex:1}.row>.pri{flex:1.6}
.photo{display:flex;align-items:center;justify-content:center;min-height:84px;margin-bottom:10px;border:2px dashed var(--meal);border-radius:12px;color:var(--meal);font-weight:600}
#prev{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px}
#prev[hidden]{display:none}
.hint{color:var(--mute);font-size:14px;margin:6px 0 12px}
code{word-break:break-all;background:var(--bg);padding:2px 5px;border-radius:6px}
.link{border:0;background:none;color:var(--meal);min-height:28px;padding:2px 6px;font-weight:600}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);min-height:54px}
nav .on{color:var(--meal);font-weight:700;box-shadow:inset 0 3px 0 var(--meal)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translate(-50%,-110px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;transition:transform .2s;max-width:92%;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><h1>Magloggen</h1><p id="st"></p></header>
<div id="toast" role="status"></div>
<main>
<section id="v-log" class="view">
  <div class="card form">
    <h2>Ny måltid</h2>
    <label class="photo" for="pic">Ta bild eller välj bild</label>
    <input type="file" id="pic" accept="image/*" hidden>
    <img id="prev" alt="" hidden>
    <input type="text" id="hint" placeholder="Kommentar till AI:n (valfritt)" autocomplete="off">
    <label class="lbl" for="mtime">Klockslag</label>
    <input type="datetime-local" id="mtime">
    <label class="lbl" for="mtxt">Måltidstext (korrigera vid behov)</label>
    <textarea id="mtxt" rows="10" placeholder="Analysen hamnar här. Du kan också skriva själv."></textarea>
    <div class="row"><button id="again">Analysera igen</button><button class="pri" id="save">Spara i Drive</button></div>
  </div>
</section>
<section id="v-set" class="view" hidden>
  <div class="card">
    <h2>Claude</h2>
    <input type="password" id="s-key" placeholder="Anthropic API-nyckel (sk-ant-…)" autocomplete="off">
    <input type="text" id="s-model" placeholder="Modell" autocomplete="off">
  </div>
  <div class="card">
    <h2>Google Drive</h2>
    <input type="text" id="s-cid" placeholder="Google Client ID" autocomplete="off">
    <input type="text" id="s-folder" placeholder="Mapp i Drive (skapas om den saknas)" autocomplete="off">
    <input type="text" id="s-file" placeholder="Loggfil" autocomplete="off">
    <p class="hint">Redirect-URI att lägga till hos Google:<br><code id="ru"></code></p>
    <div class="row"><button id="go">Logga in</button><button id="out">Logga ut</button></div>
  </div>
  <button class="pri" id="saveCfg" style="width:100%">Spara inställningar</button>
  <p class="hint">Inget av detta finns i koden på GitHub. Nycklar och inloggning sparas bara i telefonens lokala lagring. Bilder sparas inte, bara texten.</p>
</section>
</main>
<nav><button data-v="log" class="on">Ny måltid</button><button data-v="set">Inställningar</button></nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DEF='claude-haiku-5-5',G='https://www.googleapis.com/';
const REDIR=location.origin+location.pathname.replace(/[^/]*$/,'');
const cfg=()=>({key:localStorage.mk||'',model:localStorage.mm||DEF,cid:localStorage.mc||'',folder:localStorage.mf||'Magloggen',file:localStorage.mn||'matlogg.txt'});
const ob=()=>JSON.parse(localStorage.ob||'[]'),setOb=a=>localStorage.ob=JSON.stringify(a);
const tokOk=()=>!!localStorage.gt&&Date.now()<+localStorage.gx;
const pad=n=>String(n).padStart(2,'0');
const toLocal=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3500)};

const SYS=`Du hjälper en person som för mat- och magdagbok. Omvandla bilden och/eller texten av en måltid till en kort, tydlig beskrivning på svenska.
Ibland står förpackningar bredvid måltiden för att underlätta för dig att förstå vilka ingredienserna är. Läs etiketter och ingredienslistor på dem när de syns och använd dem för att avgöra ingredienserna. Förpackningarna är inte själva måltiden.
Svara ENBART med texten i exakt detta format, utan inledning och utan kodstaket:
<rättens namn>
- <ingrediens> <grov mängd>
(en rad per ingrediens)
Taggar: <valda taggar, eller "inga">
Osäkert: <kort om dolda eller osäkra ingredienser som olja, sås, kryddor, eller "inget">
Taggar väljs ENBART bland: lök, vitlök, baljväxter, kål, laktos, vete/gluten, fruktos, polyoler, sötningsmedel, kolsyra, fet mat, stark mat, alkohol, koffein, mycket fibrer. Mängder är grova uppskattningar. Om personens kommentar motsäger bilden, lita på kommentaren.`;

/* foto: klockslag ur EXIF, förminskning */
async function exifTime(f){
  try{
    const b=await f.slice(0,262144).arrayBuffer(),v=new DataView(b);
    if(v.getUint16(0)!==0xFFD8)return null;
    for(let p=2;p<v.byteLength-10;p+=2+v.getUint16(p+2)){
      if(v.getUint16(p)===0xFFE1&&v.getUint32(p+4)===0x45786966){
        const o=p+10,le=v.getUint16(o)===0x4949,u16=x=>v.getUint16(x,le),u32=x=>v.getUint32(x,le);
        const tag=(ifd,t)=>{const n=u16(o+ifd);for(let i=0;i<n;i++){const e=o+ifd+2+i*12;if(u16(e)===t)return u32(e+8)}return null};
        const i0=u32(o+4),ex=tag(i0,0x8769);
        const off=(ex!==null&&tag(ex,0x9003))||tag(i0,0x0132);
        const r=off&&new TextDecoder().decode(new Uint8Array(b,o+off,19)).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
        return r?new Date(+r[1],r[2]-1,+r[3],+r[4],+r[5],+r[6]):null;
      }
    }
  }catch(e){}
  return null;
}
const shrink=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=()=>no(new Error('Kunde inte läsa bilden'));i.src=u});

/* bild/text till måltidstext */
let pend=null;
async function analyze(){
  const {key,model}=cfg(),hint=$('#hint').value.trim(),ta=$('#mtxt'),old=ta.value;
  if(!key)return toast('Lägg in API-nyckel under Inställningar');
  if(!pend&&!hint)return toast('Lägg till en bild eller en kommentar först');
  ta.value='Analyserar…';ta.disabled=true;
  try{
    const c=[];
    if(pend)c.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:pend.split(',')[1]}});
    c.push({type:'text',text:'Klockan '+hm(new Date($('#mtime').value||Date.now()))+'. Förpackningarna bredvid måltiden (om några syns) står där för att underlätta för dig att inse vad ingredienserna till måltiden är.'+(hint?' Personens kommentar: '+hint:'')});
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:700,system:SYS,messages:[{role:'user',content:c}]})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'HTTP '+r.status);
    ta.value=j.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  }catch(x){ta.value=old;toast('Analysen misslyckades: '+(x.message||x)+'. Tryck "Analysera igen".')}
  ta.disabled=false;
}
$('#pic').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{
    $('#mtime').value=toLocal(await exifTime(f)||(f.lastModified?new Date(f.lastModified):new Date()));
    pend=await shrink(f);$('#prev').src=pend;$('#prev').hidden=false;
    analyze();
  }catch(x){toast(x.message)}
  ev.target.value='';
};
$('#again').onclick=analyze;

/* Google-inloggning (redirect, bara drive.file = appens egna filer) */
function startAuth(){
  const cid=cfg().cid;if(!cid)return toast('Lägg in Google Client ID under Inställningar');
  const st=uid()+uid();localStorage.gst=st;
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:cid,redirect_uri:REDIR,response_type:'token',scope:G+'auth/drive.file',state:st,include_granted_scopes:'true'});
}
$('#go').onclick=startAuth;
$('#out').onclick=()=>{const t=localStorage.gt;localStorage.removeItem('gt');localStorage.gx=0;if(t)fetch('https://oauth2.googleapis.com/revoke?token='+t,{method:'POST'}).catch(()=>{});toast('Utloggad från Google');status()};

/* Drive */
async function gf(path,opt={}){
  const r=await fetch(path.startsWith('http')?path:G+'drive/v3/'+path,{...opt,headers:{Authorization:'Bearer '+localStorage.gt,...(opt.headers||{})}});
  if(r.status===401){localStorage.gx=0;throw Object.assign(new Error('Inloggningen har gått ut'),{code:401})}
  if(!r.ok)throw Object.assign(new Error('Drive svarade '+r.status),{code:r.status});
  return r;
}
async function ensure(name,folder,parent){
  const q=`name='${name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}' and trashed=false and mimeType${folder?'=':'!='}'application/vnd.google-apps.folder'`+(parent?` and '${parent}' in parents`:'');
  const l=await(await gf('files?fields=files(id)&q='+encodeURIComponent(q))).json();
  if(l.files.length)return l.files[0].id;
  const b={name,mimeType:folder?'application/vnd.google-apps.folder':'text/plain'};if(parent)b.parents=[parent];
  return(await(await gf('files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json()).id;
}
async function target(){
  const c=cfg();let m=JSON.parse(localStorage.fi||'{}');
  if(m.fo!==c.folder||m.fn!==c.file||!m.id){const fid=await ensure(c.folder,true);m={fo:c.folder,fn:c.file,id:await ensure(c.file,false,fid)};localStorage.fi=JSON.stringify(m)}
  return m.id;
}
const fmt=(ts,txt)=>{const [h,...r]=txt.trim().split('\n');return `- ${hm(ts)} MÅLTID: ${h.trim()}`+r.filter(l=>l.trim()).map(l=>'\n  '+l.trim()).join('')};
function addTo(t,ts,line){
  const day=dkey(ts),parts=(t||'# Matlogg\n\n').split(/^(?=## \d{4}-\d{2}-\d{2})/m);
  const i=parts.findIndex((p,k)=>k&&p.startsWith('## '+day));
  if(i>0){parts[i]=parts[i].trimEnd()+'\n'+line+'\n\n';return parts.join('')}
  const s='## '+day+' ('+new Date(ts).toLocaleDateString('sv-SE',{weekday:'long'})+')\n'+line+'\n\n';
  let at=parts.findIndex((p,k)=>k&&p.slice(3,13)>day);if(at<0)at=parts.length;
  parts[at-1]=parts[at-1].trimEnd()+'\n\n';parts.splice(at,0,s);
  return parts.join('');
}
let busy=false;
async function flush(again=true){
  const q=ob();if(!q.length||busy||!cfg().cid||!tokOk())return status();
  busy=true;
  try{
    const id=await target();let t=await(await gf(`files/${id}?alt=media`)).text();
    for(const e of q.sort((a,b)=>a.ts-b.ts))t=addTo(t,e.ts,fmt(e.ts,e.text));
    await gf(`${G}upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'text/plain; charset=UTF-8'},body:t});
    setOb(ob().filter(e=>!q.some(s=>s.id===e.id)));toast('Sparad i Drive');
  }catch(x){
    if(x.code===404&&again){localStorage.removeItem('fi');busy=false;return flush(false)}
    toast('Drive: '+x.message+'. Måltiden ligger kvar och skickas senare.');
  }
  busy=false;status();
}

/* spara */
$('#save').onclick=()=>{
  const text=$('#mtxt').value.trim();if(!text||text==='Analyserar…')return toast('Det finns ingen måltidstext att spara');
  setOb([...ob(),{id:uid(),ts:new Date($('#mtime').value||Date.now()).getTime(),text}]);
  pend=null;$('#prev').hidden=true;$('#mtxt').value='';$('#hint').value='';$('#mtime').value=toLocal(new Date());
  if(!cfg().cid)toast('Sparad på telefonen. Ställ in Drive under Inställningar.');
  else if(!tokOk())toast('Sparad på telefonen. Logga in på Google för att skicka till Drive.');
  status();flush();
};

/* status, inställningar, flikar, start */
function status(){
  const q=ob().length,c=cfg(),el=$('#st'),ok=tokOk();
  el.textContent=(!c.cid?'Drive är inte inställt':ok?'Drive är ansluten':'Du är inte inloggad på Drive')+(q?'. '+q+' väntar på uppladdning':'')+'.';
  if(c.cid&&!ok){const b=document.createElement('button');b.className='link';b.id='login';b.textContent='Logga in';el.append(' ',b)}
  el.classList.toggle('warn',!!q||!ok);
}
$('#st').onclick=e=>{if(e.target.id==='login')startAuth()};
const FLD=[['mk','s-key'],['mm','s-model'],['mc','s-cid'],['mf','s-folder'],['mn','s-file']];
$('#saveCfg').onclick=()=>{FLD.forEach(([k,i])=>localStorage[k]=$('#'+i).value.trim());toast('Inställningar sparade');status();flush()};
$('nav').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;$$('nav button').forEach(x=>x.classList.toggle('on',x===b));$$('.view').forEach(v=>v.hidden=v.id!=='v-'+b.dataset.v);$('main').scrollTop=0};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){status();flush()}});
addEventListener('online',()=>flush());
(function(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')||h.get('error')){
    if(h.get('access_token')&&h.get('state')===localStorage.gst){localStorage.gt=h.get('access_token');localStorage.gx=Date.now()+(+h.get('expires_in')||3600)*1e3-12e4;toast('Inloggad på Google')}
    else toast('Google-inloggningen misslyckades'+(h.get('error')?': '+h.get('error'):''));
    history.replaceState(null,'',REDIR);
  }
  const c=cfg();FLD.forEach(([k,i])=>$('#'+i).value=c[{mk:'key',mm:'model',mc:'cid',mf:'folder',mn:'file'}[k]]);
  $('#ru').textContent=REDIR;$('#mtime').value=toLocal(new Date());
  status();flush();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
